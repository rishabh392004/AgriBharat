services:
  postgres:
    image: postgres:16-alpine
    container_name: agribharat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agribharat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agribharat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot schema migration service.
  # Uses the 'migrator' stage of the Dockerfile which includes the full prisma CLI.
  # 'prisma db init' applies all tracked forward migrations idempotently.
  # This is the SINGLE canonical source of truth for the database schema.
  # create_tables.sql is archived for human reference only — it is NOT used
  # to provision any database.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: agribharat-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agribharat}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: agribharat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agribharat}
      JWT_SECRET: ${JWT_SECRET:-change-this-production-jwt-secret-min-32-chars-long}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8000}
      CHATBOT_SERVICE_URL: ${CHATBOT_SERVICE_URL:-http://host.docker.internal:8001}
      CHATBOT_TIMEOUT_MS: ${CHATBOT_TIMEOUT_MS:-15000}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
